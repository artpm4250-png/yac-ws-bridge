name: Build iOS IPA

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.100'

jobs:
  build-ios:
    name: MAUI iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_ROOT=/Applications/Xcode_26.3.app
          ls -1 /Applications | grep -E '^Xcode' || true
          sudo xcode-select -s "$XCODE_ROOT/Contents/Developer"
          echo "MD_APPLE_SDK_ROOT=$XCODE_ROOT" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$XCODE_ROOT/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Retarget MAUI project for runner
        working-directory: maui-client
        run: |
          set -euo pipefail
          perl -0pi -e 's/net10\.0-/net9.0-/g; s/Version="10\.0\.51"/Version="9.0.120"/g' BridgeToFreedom.csproj
          grep -n "TargetFrameworks\\|PackageReference" BridgeToFreedom.csproj

      - name: Restore MAUI workloads
        working-directory: maui-client
        run: dotnet workload restore BridgeToFreedom.csproj --ignore-failed-sources --skip-manifest-update

      - name: Publish iOS app
        working-directory: maui-client
        run: |
          dotnet publish BridgeToFreedom.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=false \
            -p:BuildIpa=false \
            -p:CodesignKey= \
            -p:CodesignProvision= \
            -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false

      - name: Pack unsigned IPA
        working-directory: maui-client
        run: |
          set -euo pipefail
          APP="$(find bin -name '*.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then
            APP="$(find . -name '*.app' -type d | head -n 1)"
          fi
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            find . -maxdepth 8 \( -name '*.app' -o -name '*.ipa' -o -name '*.dSYM' \) -print
            find bin obj publish -maxdepth 8 -type d 2>/dev/null | sed -n '1,240p'
            exit 1
          fi
          echo "Packing $APP"
          rm -rf out Payload
          mkdir -p out Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry out/BridgeToFreedom-ios-unsigned.ipa Payload
          /usr/bin/zip -qry out/BridgeToFreedom-ios-app.zip Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeToFreedom-ios-unsigned
          path: |
            maui-client/out/BridgeToFreedom-ios-unsigned.ipa
            maui-client/out/BridgeToFreedom-ios-app.zip
          if-no-files-found: error
